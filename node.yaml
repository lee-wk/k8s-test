vmType: "vz"
cpus: 2
memory: "3GiB"
disk: "20GiB"

images:
- location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-arm64.img"
  arch: "aarch64"

networks:
- lima: user-v2

mounts: []

containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux
    apt-get update
    apt-get install -y open-iscsi nfs-common jq curl
    systemctl enable --now iscsid
