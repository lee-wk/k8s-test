apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-html
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels: {app: nginx}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nginx}
  template:
    metadata:
      labels: {app: nginx}
    spec:
      initContainers:
      - name: seed
        image: busybox:1.36
        command: ["sh","-c","echo '<h1>hello from rke2 HA + cilium + metallb + longhorn</h1>' > /html/index.html"]
        volumeMounts:
        - {name: html, mountPath: /html}
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - {name: html, mountPath: /usr/share/nginx/html}
      volumes:
      - name: html
        persistentVolumeClaim:
          claimName: nginx-html
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: LoadBalancer
  selector: {app: nginx}
  ports:
  - port: 80
    targetPort: 80
